<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1 class="titulo-login">Login</h1>
    <section class="login">
        <div>
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" class="inputs" placeholder="Ej.bisonte">
            <span id="error-usuario" class="error-text"></span>
        </div>
        <div>
            <label for="psw">Contraseña:</label>
            <input type="text" id="psw" class="inputs" placeholder="Ej.b1s0nBot">
            <span id="error-psw" class="error-text"></span>
        </div>
        <div class="ultimo">
            <span id="error-general" class="error-text general"></span>
            <button type="button" id="btn-login">Iniciar sesión</button>
            <a href="#">Olvidé mi contraseña</a>
        </div>
    </section>

</body>

</html>
